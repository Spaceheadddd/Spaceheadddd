name: Build Hand Warmer APK

on:
  push:
    paths:
      - "hand-warmer/**"
      - ".github/workflows/hand-warmer.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hand-warmer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: hand-warmer-apk
          path: hand-warmer/app/build/outputs/apk/debug/app-debug.apk
